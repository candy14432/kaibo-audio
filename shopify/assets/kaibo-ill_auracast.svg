<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 64">
<style>
.s{fill:none;stroke:#0B0B0C;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.d{fill:#0B0B0C}
.w{transform-box:view-box;transform-origin:104px 32px;animation:w 2.8s ease-out infinite}
.w2{animation-delay:.45s}.w3{animation-delay:.9s}
@keyframes w{0%{opacity:0;transform:scale(1.12)}30%{opacity:.95}72%{opacity:.3}100%{opacity:0;transform:scale(.5)}}
.lit{animation:lit 2.8s ease-out infinite;animation-delay:1.4s}
@keyframes lit{0%,55%{opacity:.22}70%{opacity:1}100%{opacity:.22}}
@media (prefers-reduced-motion:reduce){.w,.lit{animation:none}.w{opacity:.5}.lit{opacity:.9}}
</style>
<!-- the broadcast arrives from the left and the device itself is the receiver,
     so there is no headset drawn in between -->
<path class="s w w3" d="M22 7a42 42 0 0 0 0 50"/>
<path class="s w w2" d="M38 15a29 29 0 0 0 0 34"/>
<path class="s w"    d="M54 22a16 16 0 0 0 0 20"/>
<rect class="s" x="-7" y="-15" width="14" height="30" rx="7" transform="translate(105 32) rotate(10)"/>
<circle class="d lit" cx="103" cy="23" r="2.1"/>
</svg>
