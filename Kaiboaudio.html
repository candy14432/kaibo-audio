        e.target.tagName, String(e.target.src || e.target.href || ''));

    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only

      // and sender identity (own child frame / direct parent) is checked

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

      for (const f of Array.from(document.querySelectorAll('iframe'))) {

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach

        // Text is accepted only from the direct parent — the document

    const resourceMap = {};
    for (const entry of extResources) {

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-kb-y, 50%);\n    transform: translate(-50%, -50%);\n    width: 22px; height: 22px;\n    border: 1.6px solid #0B0B0C; border-radius: 50%; opacity: 0; }\n  @media (hover: hover) and (pointer: fine) {\n    #contact[data-hover=\"1\"] .kb-ripple { opacity: 1; }\n    .kb-ripple span { animation: kb-ping 2.4s cubic-bezier(.16,1,.3,1) infinite; }\n    .kb-ripple span:nth-child(2) { animation-delay: .8s; }\n    .kb-ripple span:nth-child(3) { animation-delay: 1.6s; }\n  }\n  @keyframes kb-ping {\n    0%   { width: 22px;  height: 22px;  border-width: 1.6px; opacity: 0; }\n    14%  { opacity: .32; }\n    100% { width: 184px; height: 184px; border-width: .4px;  opacity: 0; }\n  }\n  @media (prefers-reduced-motion: reduce) {\n    .kb-ripple span { animation: none !important; }\n  }\n\n  /* Past the four full-screen sections the header stops sitting over video, takes\n     its own backdrop, and picks up the tone of whichever band is under it. */\n  header[data-solid=\"1\"] { backdrop-filter: none !important;\n    transition: background-color .25s ease, border-color .25s ease; }\n  header[data-solid=\"1\"] .nav-links a { transition: color .25s ease, border-color .25s ease; }\n\n  header[data-solid=\"1\"][data-theme=\"dark\"] { background: #0B0B0C !important;\n    border-bottom: 1px solid rgba(255,255,255,.09); }\n  header[data-solid=\"1\"][data-theme=\"dark\"] .kb-nav-top { color: #FAFAFA !important; }\n  header[data-solid=\"1\"][data-theme=\"dark\"] .kb-cta { background: #fff !important;\n    border-color: #fff !important; color: #0B0B0C !important; }\n  header[data-solid=\"1\"][data-theme=\"dark\"] .kb-cta:hover { background: #E4E4E1 !important;\n    border-color: #E4E4E1 !important; color: #0B0B0C !important; }\n\n  header[data-solid=\"1\"][data-theme=\"light\"] { background: #F6F6F4 !important;\n    border-bottom: 1px solid #E4E4E1; }\n  header[data-solid=\"1\"][data-theme=\"light\"] .kb-nav-top { color: #57575C !important; }\n  header[data-solid=\"1\"][data-theme=\"light\"] .kb-cta { background: #0B0B0C !important;\n    border-color: #0B0B0C !important; color: #fff !important; }\n  header[data-solid=\"1\"][data-theme=\"light\"] .kb-cta:hover { background: #2A2A2E !important;\n    border-color: #2A2A2E !important; color: #fff !important; }\n  /* the supplied light/dark marks are swapped outright — never recoloured */\n  header[data-solid=\"1\"][data-theme=\"light\"] .logo-on-dark { display: none !important; }\n  header[data-solid=\"1\"][data-theme=\"light\"] .logo-on-light { display: block !important; }\n  /* the dropdown is part of the bar, so it flips with it — white panel on the\n     light bar so it still reads as a separate surface */\n  header[data-solid=\"1\"][data-theme=\"light\"] .kb-drop { background: #fff; border-color: #E4E4E1; }\n  header[data-solid=\"1\"][data-theme=\"light\"] .kb-drop a { color: #0B0B0C; }\n  header[data-solid=\"1\"][data-theme=\"light\"] .kb-drop a:hover { background: rgba(11,11,12,.06); color: #0B0B0C; }\n  header[data-solid=\"1\"][data-theme=\"light\"] .kb-drop [aria-disabled=\"true\"] { color: #A1A1A6; }\n  body { margin:0; background:#0B0B0C; color:#FAFAFA; font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; text-wrap:pretty; }\n  a { color:#FAFAFA; text-decoration:none; }\n  a:hover { color:#A1A1A6; }\n  input, textarea, select, button { font-family:inherit; }\n  h1, h2, h3, .wordmark { font-family:'Manrope', system-ui, sans-serif; }\n\n  /* ---- Responsive. Layout is authored with inline styles, so these\n     overrides need !important to win. ---- */\n  /* three cards now — drop straight to one column rather than leaving an empty cell */\n  @media (max-width: 820px) {\n    .cards { grid-template-columns: minmax(0,1fr) !important; }\n  }\n  @media (max-width: 960px) {\n    /* The document is content-box, so the hero's width:100% + side padding\n       overflows a phone viewport and the hero's overflow:hidden clips the copy.\n       width:auto makes it shrink-to-fit like every other .pad container.\n       (Do NOT switch .pad to border-box instead — max-width:1320px would then\n       shift the hero copy 44px right of the sections below on desktop.) */\n    .pad { padding-left: 28px !important; padding-right: 28px !important; width: auto !important; }\n    .nav-links { gap: 0 !important; }\n    .kb-nav-item { display: none !important; }\n    .scene { grid-template-columns: minmax(0,1fr) !important; height: auto !important; min-height: 100vh !important; min-height: 100dvh !important; }\n    .scene-media { order: 1 !important; min-height: 42vh !important; }\n    .scene-text { order: 2 !important; padding: 56px 28px 72px !important; }\n    .sys-head, .tech-grid, .contact-grid { grid-template-columns: minmax(0,1fr) !important; gap: 34px !important; }\n    .tech-cards { grid-template-columns: minmax(0,1fr) !important; }\n    /* stacked: the divider belongs between the rows, not on the right edge */\n    .tech-cards > div:first-child { border-right: none !important; border-bottom: 1px solid #E4E4E1 !important; }\n    #products, #technology, #contact { padding-top: 84px !important; padding-bottom: 84px !important; }\n    /* the merged contact band ends with its own footer row, which supplies the bottom edge */\n    #contact { padding-bottom: 0 !important; }\n  }\n  /* ---- Primary nav: three ranges, each with a plain black dropdown ---- */\n  .kb-nav-item { position: relative; }\n  .kb-nav-top { display: inline-flex; align-items: center; gap: 7px; height: 76px;\n    padding: 0; background: none; border: 0; cursor: pointer;\n    color: #A1A1A6; font-size: 15px; font-weight: 500; letter-spacing: .01em;\n    font-family: inherit; transition: color .25s ease; }\n  .kb-nav-top::after { content: ''; width: 5px; height: 5px; margin-top: -3px;\n    border-right: 1px solid currentColor; border-bottom: 1px solid currentColor;\n    transform: rotate(45deg); }\n  .kb-drop { position: absolute; top: 76px; left: 50%; transform: translateX(-50%);\n    min-width: 214px; padding: 6px 0; background: #0B0B0C;\n    border: 1px solid rgba(255,255,255,.14); display: none; }\n  .kb-nav-item:hover .kb-drop, .kb-nav-item:focus-within .kb-drop { display: block; }\n  .kb-drop a, .kb-drop span { display: block; padding: 12px 20px; font-size: 15px;\n    font-weight: 500; white-space: nowrap; color: #FAFAFA; }\n  .kb-drop a:hover { background: rgba(255,255,255,.08); color: #fff; }\n  .kb-drop [aria-disabled=\"true\"] { color: #5A5A5F; cursor: default; }\n\n  /* ---- Mobile menu ---- */\n  .kb-burger, .kb-menu { display: none; }\n  /* cropping the supplied lockup rather than shipping a second asset: the mark\n     occupies the first square of the artwork, so a square box + cover shows it alone */\n  .wordmark { object-fit: cover; object-position: left center; }\n  @media (max-width: 960px) {\n    header .wordmark { width: 30px !important; }\n    #contact .foot .wordmark { width: 24px !important; }\n    .nav-links { margin-left: auto !important; }\n    header .pad { gap: 14px !important; }\n    .kb-burger { display: inline-flex; flex-direction: column; justify-content: center; gap: 6px;\n      width: 40px; height: 38px; padding: 0 8px; margin-left: 4px;\n      background: none; border: 0; cursor: pointer; }\n    .kb-burger span { display: block; width: 24px; height: 1.5px; background: #FAFAFA;\n      transition: transform .25s ease; }\n    header[data-solid=\"1\"][data-theme=\"light\"] .kb-burger span { background: #0B0B0C; }\n    header[data-menu=\"1\"] .kb-burger span:first-child { transform: translateY(3.75px) rotate(45deg); }\n    header[data-menu=\"1\"] .kb-burger span:last-child  { transform: translateY(-3.75px) rotate(-45deg); }\n\n    .kb-menu { display: grid; position: fixed; left: 0; right: 0; top: 76px;\n      background: #0B0B0C; max-height: 0; overflow: hidden;\n      transition: max-height .3s cubic-bezier(.16,1,.3,1); }\n    header[data-menu=\"1\"] .kb-menu { max-height: 72vh; overflow-y: auto;\n      border-bottom: 1px )\">\n  <div class=\"pad\" style=\"max-width:1320px;margin:0 auto;padding:0 44px;height:76px;display:flex;align-items:center;justify-content:space-between;gap:32px\">\n    <div style=\"display:flex;align-items:center;gap:12px\">\n      <img class=\"wordmark logo-on-dark\" src=\"uploads/logo_kaibo_light.svg\" alt=\"Kaibo audio\" style=\"height:30px;width:auto;display:block\">\n      <img class=\"wordmark logo-on-light\" src=\"uploads/logo_kaibo_dark.svg\" alt=\"\" aria-hidden=\"true\" style=\"height:30px;width:auto;display:none\">\n      \n    <\u002Fdiv>\n    <nav class=\"nav-links\" style=\"display:flex;align-items:center;gap:34px\">\n      <div class=\"kb-nav-item\">\n        <button class=\"kb-nav-top\" type=\"button\" aria-haspopup=\"true\">TV Hearing Assistance<\u002Fbutton>\n        <div class=\"kb-drop\">\n          <a href=\"#scenes\">Where it works<\u002Fa>\n          <a href=\"#technology\">Technology<\u002Fa>\n          <a href=\"#products\">Products<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kb-nav-item\">\n        <button class=\"kb-nav-top\" type=\"button\" aria-haspopup=\"true\">Tour Hearing Assistance<\u002Fbutton>\n        <div class=\"kb-drop\">\n          <span aria-disabled=\"true\">Where it works<\u002Fspan>\n          <span aria-disabled=\"true\">Technology<\u002Fspan>\n          <span aria-disabled=\"true\">Products<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kb-nav-item\">\n        <button class=\"kb-nav-top\" type=\"button\" aria-haspopup=\"true\">Personal Hearing Assistance<\u002Fbutton>\n        <div class=\"kb-drop\">\n          <span aria-disabled=\"true\">Where it works<\u002Fspan>\n          <span aria-disabled=\"true\">Technology<\u002Fspan>\n          <span aria-disabled=\"true\">Products<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <a class=\"kb-cta\" href=\"#contact\" style=\"display:inline-flex;align-items:center;height:38px;padding:0 20px;background:#fff;border:1px solid #fff;border-radius:6px;color:#0B0B0C;font-size:15px;font-weight:600\" style-hover=\"background:#E4E4E1;border-color:#E4E4E1;color:#0B0B0C\">{{ ctaLabel }}<\u002Fa>\n    <\u002Fnav>\n    <button class=\"kb-burger\" type=\"button\" aria-label=\"Menu\" aria-expanded=\"false\" aria-controls=\"kb-menu\">\n      <span><\u002Fspan><span><\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"kb-menu\" id=\"kb-menu\">\n    <div class=\"kb-mgroup\">\n      <div class=\"kb-mtitle\">TV Hearing Assistance<\u002Fdiv>\n      <a href=\"#scenes\">Where it works<\u002Fa>\n      <a href=\"#technology\">Technology<\u002Fa>\n      <a href=\"#products\">Products<\u002Fa>\n    <\u002Fdiv>\n    <div class=\"kb-mgroup\">\n      <div class=\"kb-mtitle\">Tour Hearing Assistance<\u002Fdiv>\n      <span aria-disabled=\"true\">Where it works<\u002Fspan>\n      <span aria-disabled=\"true\">Technology<\u002Fspan>\n      <span aria-disabled=\"true\">Products<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"kb-mgroup\">\n      <div class=\"kb-mtitle\">Personal Hearing Assistance<\u002Fdiv>\n      <span aria-disabled=\"true\">Where it works<\u002Fspan>\n      <span aria-disabled=\"true\">Technology<\u002Fspan>\n      <span aria-disabled=\"true\">Products<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section class=\"snap\" data-play-in-view=\"\" style=\"position:relative;height:100vh;height:100dvh;min-height:680px;overflow:hidden;background:#000\">\n  <div class=\"kb-hero-media\" style=\"position:absolute;inset:0;transform:scale(1);transform-origin:50% 45%;will-change:transform\">\n    <sc-if value=\"{{ hasVideo }}\" hint-placeholder-val=\"{{ false }}\">\n      <video ref=\"{{ videoRef }}\" autoplay=\"{{ true }}\" muted=\"{{ true }}\" loop=\"{{ true }}\" sc-camel-plays-inline=\"{{ true }}\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fvideo>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <sc-if value=\"{{ showVideoHint }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position:absolute;top:96px;left:0;right:0;display:flex;justify-content:center;pointer-events:none\">\n      <div style=\"padding:10px 18px;border:1px dashed rgba(255,255,255,0.22);color:#6E6E73;font-size:12px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase\">Hero film — set the video path in Tweaks<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <div style=\"position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.5) 0%,rgba(0,0,0,0.12) 42%,rgba(11,11,12,0.45) 88%,rgba(11,11,12,0.8) 100%);pointer-events:none\"><\u002Fdiv>\n  <div class=\"kb-hero-copy\" style=\"position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;pointer-events:none;opacity:1\">\n    <div class=\"pad\" style=\"max-width:1320px;width:100%;margin:0 auto;padding:0 44px 88px\">\n      <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:28px;animation:fadeIn 900ms ease both 200ms\">\n        \n        <span style=\"color:#C7C7CC;font-size:11px;font-weight:600;letter-spacing:0.22em;text-transform:uppercase\">Bluetooth LE Audio broadcast<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"margin:0;max-width:15ch;color:#fff;font-size:clamp(52px,7vw,104px);line-height:0.95;font-weight:700;letter-spacing:-0.045em;text-wrap:balance;animation:riseIn 1000ms cubic-bezier(0.16,1,0.3,1) both 320ms\">One transmitter, every listener.<\u002Fh1>\n      <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:60px;margin-top:36px;animation:riseIn 1000ms cubic-bezier(0.16,1,0.3,1) both 520ms\">\n        <p style=\"margin:0;max-width:46ch;color:#C7C7CC;font-size:19px;line-height:1.55\">A lightweight open-ear headset for the guest, and the transmitter that feeds it — supplied as one system by Kaibo audio. Broadcast over Bluetooth LE&nbsp;Audio: one channel per screen, no wiring.<\u002Fp>\n        \n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"scenes\" style=\"background:#0B0B0C\">\n\n  <div class=\"snap scene\" data-play-in-view=\"\" style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);height:100vh;height:100dvh;min-height:640px;border-top:1px solid rgba(255,255,255,0.1)\">\n    <div class=\"scene-media\" style=\"position:relative;background:#141416;overflow:hidden\">\n      <video src=\"uploads/shot2_v2.mp4\" muted=\"muted\" loop=\"loop\" playsinline=\"playsinline\" preload=\"auto\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fvideo>\n    <\u002Fdiv>\n    <div class=\"scene-text\" style=\"display:flex;flex-direction:column;justify-content:center;padding:96px 8vw 96px 76px\">\n      <div style=\"color:#6E6E73;font-size:11px;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;margin-bottom:22px\">01 — Airport lounges<\u002Fdiv>\n      <h2 style=\"margin:0;max-width:16ch;color:#FAFAFA;font-size:clamp(38px,3.4vw,52px);line-height:1.04;font-weight:700;letter-spacing:-0.04em\">The screen stays muted. The traveller still hears it.<\u002Fh2>\n      <p style=\"margin:26px 0 0;max-width:44ch;color:#8E8E93;font-size:17px;line-height:1.62\">Lounges run their displays silent to keep the room calm. The audio is broadcast over Bluetooth LE Audio instead, so any guest who wants the news, the match or the gate channel simply listens in — and everyone else keeps the quiet.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"snap scene\" data-play-in-view=\"\" style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);height:100vh;height:100dvh;min-height:640px;border-top:1px solid rgba(255,255,255,0.1)\">\n    <div class=\"scene-text\" style=\"display:flex;flex-direction:column;justify-content:center;padding:96px 76px 96px 8vw;order:0\">\n      <div style=\"color:#6E6E73;font-size:11px;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;margin-bottom:22px\">02 — Hotels<\u002Fdiv>\n      <h2 style=\"margin:0;max-width:16ch;color:#FAFAFA;font-size:clamp(38px,3.4vw,52px);line-height:1.04;font-weight:700;letter-spacing:-0.04em\">A quiet lobby and a live match, at the same time.<\u002Fh2>\n      <p style=\"margin:26px 0 0;max-width:44ch;color:#8E8E93;font-size:17px;line-height:1.62\">Lobby, bar and fitness room screens each get their own channel. The guest chooses which one to hear from the headset — nothing is queued at reception, and the atmosphere of the room is never decided by the loudest television.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"scene-media\" style=\"position:relative;background:#141416;overflow:hidden\">\n      <video src=\"uploads/shot3_v2.mp4\" muted=\"muted\" loop=\"loop\" playsinline=\"playsinline\" preload=\"auto\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fvideo>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"snap scene\" data-play-in-view=\"\" style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);height:100vh;height:100dvh;min-height:640px;border-top:1px solid rgba(255,255,255,0.1)\">\n    <div class=\"scene-media\" style=\"position:relative;background:#141416;overflow:hidden\">\n      <video src=\"uploads/shot4-1.mp4\" muted=\"muted\" loop=\"loop\" playsinline=\"playsinline\" preload=\"auto\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fvideo>\n    <\u002Fdiv>\n    <div class=\"scene-text\" style=\"display:flex;flex-direction:column;justify-content:center;padding:96px 8vw 96px 76px\">\n      <div style=\"color:#6E6E73;font-size:11px;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;margin-bottom:22px\">03 — Bars<\u002Fdiv>\n      <h2 style=\"margin:0;max-width:16ch;color:#FAFAFA;font-size:clamp(38px,3.4vw,52px);line-height:1.04;font-weight:700;letter-spacing:-0.04em\">Your table, your channel.<\u002Fh2>\n      <p style=\"margin:26px 0 0;max-width:44ch;color:#8E8E93;font-size:17px;line-height:1.62\">Conversation, music, a room at full volume — the commentary never has to compete with any of it. It goes straight to the headset instead, so the guest hears every moment of the match while the bar stays exactly as lively as it is.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fsection>\n\n<section id=\"technology\" data-theme=\"light\" class=\"snap\" style=\"box-sizing:border-box;background:#F6F6F4;padding:120px 0;color:#0B0B0C;min-height:100vh;min-height:100dvh;display:flex;align-items:center\">\n  <div class=\"pad tech-grid\" style=\"width:100%;max-width:1320px;margin:0 auto;padding:0 44px;display:grid;grid-template-columns:minmax(0,0.85fr) minmax(0,1.15fr);gap:96px\">\n    <div>\n      <div style=\"color:#8A8A8F;font-size:11px;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;margin-bottom:22px\">Technology<\u002Fdiv>\n      <h2 style=\"margin:0;color:#0B0B0C;font-size:clamp(40px,4vw,56px);line-height:1.02;font-weight:700;letter-spacing:-0.04em\">Bluetooth LE&nbsp;Audio, the current standard.<\u002Fh2>\n      <p style=\"margin:26px 0 0;color:#57575C;font-size:17px;line-height:1.62\">Kaibo builds on the latest Bluetooth LE&nbsp;Audio standard rather than a closed radio protocol — an open standard, and the reason many-to-many broadcasting is possible in the first place.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"tech-cards\" style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;border:1px solid #E4E4E1;align-self:center\">\n      <div style=\"padding:38px 32px 42px;border-right:1px solid rgb(228, 228, 225)\">\n        <img src=\"uploads/web/ill_broadcast.svg\" alt=\"\" aria-hidden=\"true\" style=\"width:80%;height:fit-content;display:block;margin-bottom:22px\">\n        <div style=\"color:#0B0B0C;font-size:16px;font-weight:600;margin-bottom:10px\">Broadcast, not paired<\u002Fdiv>\n        <p style=\"margin:0;color:#57575C;font-size:15px;line-height:1.6\">A channel is never tied to one device, so a single screen can serve as many listeners as the venue has.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:38px 32px 42px\">\n        <img src=\"uploads/web/ill_channels.svg\" alt=\"\" aria-hidden=\"true\" style=\"width:80%;height:fit-content;display:block;margin-bottom:22px\">\n        <div style=\"color:#0B0B0C;font-size:16px;font-weight:600;margin-bottom:10px\">Many channels, one room<\u002Fdiv>\n        <p style=\"margin:0;color:#57575C;font-size:15px;line-height:1.6\">Several transmitters run in the same space, each as its own channel, and the listener switches between them freely.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"products\" data-theme=\"dark\" style=\"background:#0B0B0C;padding:120px 0;color:#FAFAFA\">\n  <div class=\"pad\" style=\"max-width:1320px;margin:0 auto;padding:0 44px\">\n    <div class=\"sys-head\" style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:80px;align-items:end;margin-bottom:64px\">\n      <div>\n        <div style=\"color:#6E6E73;font-size:11px;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;margin-bottom:22px\">Products<\u002Fdiv>\n        <h2 style=\"margin:0;color:#FAFAFA;font-size:clamp(40px,4vw,56px);line-height:1.02;font-weight:700;letter-spacing:-0.04em\">Transmitter and headset, supplied as one solution.<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 6px;color:#8E8E93;font-size:17px;line-height:1.62\">Nothing here is a component you have to build around. Kaibo audio supplies both halves — the transmitter that takes audio from the source, and the receivers your guests wear — matched and ready to deploy.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"cards feature\" style=\"display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:0;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.1)\">\n      <div data-reveal=\"\" style=\"background:#fff;display:flex;align-items:center;justify-content:center;padding:44px 40px\">\n        <img src=\"uploads/web/img_p3_linkmore.png\" alt=\"LinkMore\" style=\"width:100%;max-width:620px;height:auto;display:block\">\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"background:#fff;padding:32px 30px 36px;display:flex;flex-direction:column;justify-content:center\">\n        <div style=\"color:#8A8A8F;font-size:11px;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;margin-bottom:18px\">Transmitter<\u002Fdiv>\n        <h3 style=\"margin:0 0 16px;color:#0B0B0C;font-size:clamp(28px,2.4vw,36px);line-height:1.08;font-weight:700;letter-spacing:-0.03em\">LinkMore<\u002Fh3>\n        <p style=\"margin:0;color:#57575C;font-size:16px;line-height:1.62\">Wireless audio transmitter and easy to connect with TV audio output, make TV to broadcast the sound directly.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"cards\" style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.1);border-top:none\">\n      <div data-reveal=\"\" style=\"background:#fff;padding:32px 30px 36px\">\n        <div style=\"height:180px;margin-bottom:28px\"><img src=\"uploads/web/img_p1_linkmic.png\" alt=\"Receiver\" style=\"width:100%;height:100%;object-fit:contain;display:block\"><\u002Fdiv>\n        <h3 style=\"margin:0 0 10px;color:#0B0B0C;font-size:20px;font-weight:700;letter-spacing:-0.02em\">Receiver<\u002Fh3>\n        <p style=\"margin:0;color:#57575C;font-size:15px;line-height:1.6\">Placeholder copy — the receiver your guests wear to pick up the venue&rsquo;s channels. Final wording to follow.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"background:#fff;padding:32px 30px 36px\">\n        <div style=\"height:180px;margin-bottom:28px\"><img src=\"uploads/web/img_p4_cast.png\" alt=\"Cast SE\" style=\"width:100%;height:100%;object-fit:contain;display:block\"><\u002Fdiv>\n        <h3 style=\"margin:0 0 10px;color:#0B0B0C;font-size:20px;font-weight:700;letter-spacing:-0.02em\">Cast SE<\u002Fh3>\n        <p style=\"margin:0;color:#57575C;font-size:15px;line-height:1.6\">Lightweight and comfortable, worn all day. Open-ear design and single ear to simple wear for listening.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"background:#fff;padding:32px 30px 36px\">\n        <div style=\"height:180px;margin-bottom:28px\"><img src=\"uploads/web/img_p2_castone.png\" alt=\"Cast One\" style=\"width:100%;height:100%;object-fit:contain;display:block\"><\u002Fdiv>\n        <h3 style=\"margin:0 0 10px;color:#0B0B0C;font-size:20px;font-weight:700;letter-spacing:-0.02em\">Cast One<\u002Fh3>\n        <p style=\"margin:0;color:#57575C;font-size:15px;line-height:1.6\">Lightweight and comfortable, worn all day. Open-ear design keeps the listener aware of their surroundings — essential in a bar or a lounge.<\u002Fp>\n      <\u002Fdiv>\n<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contact\" data-theme=\"light\" class=\"snap\" style=\"box-sizing:border-box;position:relative;overflow:hidden;background:#FAFAFA;color:#0B0B0C;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:110px 0 0\">\n  <div class=\"kb-ripple\" aria-hidden=\"true\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv>\n  <div class=\"pad contact-grid\" style=\"position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:0 44px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:96px;align-items:start;flex:1;align-content:center\">\n    <div>\n      <div style=\"color:#8A8A8F;font-size:11px;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;margin-bottom:22px\">Partner with Kaibo audio<\u002Fdiv>\n      <h2 style=\"margin:0;max-width:16ch;color:#0B0B0C;font-size:clamp(40px,4vw,56px);line-height:1.02;font-weight:700;letter-spacing:-0.04em\">Let's talk.<\u002Fh2>\n      <p style=\"margin:26px 0 0;max-width:44ch;color:#57575C;font-size:17px;line-height:1.62\">Tell us the market you cover — fitness, hospitality or transport — and we will come back with pricing, demo units and a deployment plan.<\u002Fp>\n      \n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E4E4E1;padding:40px 38px\">\n      <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"min-height:264px;display:flex;flex-direction:column;justify-content:center;gap:14px\">\n          <div style=\"color:#0B0B0C;font-size:26px;font-weight:600;letter-spacing:-0.025em\">Thank you — we have it.<\u002Fdiv>\n          <p style=\"margin:0;color:#57575C;font-size:16px;line-height:1.6\">A partnership manager at Kaibo audio will be in touch about pricing and demo-unit availability.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:24px\">\n          <label style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"color:#8A8A8F;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase\">Name<\u002Fspan><input type=\"text\" style=\"height:42px;border:none;border-bottom:1px solid #D6D6D2;background:none;font-size:16px;color:#0B0B0C;outline:none\" style-focus=\"border-bottom-color:#0B0B0C\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"color:#8A8A8F;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase\">Work email<\u002Fspan><input type=\"email\" style=\"height:42px;border:none;border-bottom:1px solid #D6D6D2;background:none;font-size:16px;color:#0B0B0C;outline:none\" style-focus=\"border-bottom-color:#0B0B0C\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"color:#8A8A8F;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase\">Market you cover<\u002Fspan>\n            <sc-raw-select style=\"height:42px;border:none;border-bottom:1px solid #D6D6D2;background:none;font-size:16px;color:#0B0B0C;outline:none\" style-focus=\"border-bottom-color:#0B0B0C\">\n              <option>Fitness chains<\u002Foption>\n              <option>Hotels &amp; hospitality<\u002Foption>\n              <option>Airports &amp; lounges<\u002Foption>\n              <option>Systems integration / AV<\u002Foption>\n              <option>Distribution &amp; resale<\u002Foption>\n              <option>Corporate IT &amp; facilities<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Flabel>\n          <button sc-camel-on-click=\"{{ submit }}\" style=\"margin-top:12px;height:50px;background:#0B0B0C;color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer\" style-hover=\"background:#2A2A2E\">Send enquiry<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:relative;z-index:1;margin-top:auto;width:100%;padding:26px 0;border-top:1px solid #E4E4E1\">\n  <div class=\"pad foot\" style=\"max-width:1320px;margin:0 auto;padding:0 44px;display:flex;align-items:center;justify-content:space-between;gap:40px\">\n    <div style=\"display:flex;align-items:center;gap:14px\">\n      <img class=\"wordmark\" src=\"uploads/logo_kaibo_dark.svg\" alt=\"Kaibo audio\" style=\"height:24px;width:auto;display:block\">\n      <span style=\"color:#8A8A8F;font-size:13px\">Sound. Connection. Life.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"color:#8A8A8F;font-size:13px\">© 2026 Kaibo audio<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440},&quot;heroVideoSrc&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;uploads/shot1_v5.mp4&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Hero&quot;},&quot;ctaLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Contact us&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = { sent: false, videoOk: false, videoFailed: false };\n\n  componentDidMount() {\n    this._header = document.querySelector('header');\n    // Technology and Contact are snap targets too now, so the four opening\n    // bands are the hero plus the three scenes — keyed off the last scene.\n    const scenes = document.querySelectorAll('.scene');\n    this._lastSnap = scenes.length ? scenes[scenes.length - 1] : null;\n    this._themed = document.querySelectorAll('[data-theme]');\n    this._heroMedia = document.querySelector('.kb-hero-media');\n    this._heroCopy = document.querySelector('.kb-hero-copy');\n    this._ticking = false;\n\n    // Parallax is written straight to the two hero nodes inside a rAF instead of\n    // going through component state. Scroll events outrun the display, and every\n    // setState rewrote the video wrapper's transform — which re-rasterised the\n    // video layer and made it flicker. Nothing re-renders on scroll now.\n    const frame = () => {\n      this._ticking = false;\n      const y = window.scrollY || 0;\n      const vh = window.innerHeight || 900;\n      const p = Math.min(1, y / vh);\n      if (this._heroMedia) this._heroMedia.style.transform = 'scale(' + (1 + p * 0.14).toFixed(4) + ')';\n      if (this._heroCopy) this._heroCopy.style.opacity = (1 - Math.min(1, p * 1.35)).toFixed(3);\n      if (this._header && this._lastSnap) {\n        const h = this._header.offsetHeight;\n        const past = this._lastSnap.getBoundingClientRect().bottom <= h;\n        const v = past ? '1' : '0';\n        if (this._header.dataset.solid !== v) this._header.dataset.solid = v;\n        if (past) {\n          const probe = h * 0.6;                    // a point just inside the bar\n          let theme = 'dark';\n          for (const el of this._themed) {\n            const r = el.getBoundingClientRect();\n            if (r.top <= probe && r.bottom > probe) { theme = el.dataset.theme; break; }\n          }\n          if (this._header.dataset.theme !== theme) this._header.dataset.theme = theme;\n        }\n      }\n    };\n    this._onScroll = () => { if (!this._ticking) { this._ticking = true; requestAnimationFrame(frame); } };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onScroll();\n    // Each film plays only while its own section is on screen. The videos ride\n    // inside this file, so this saves decode and battery rather than download —\n    // and stops three clips decoding at once. dataset.inView lets the hero's\n    // canplay handler below know whether it is allowed to start.\n    if (typeof IntersectionObserver !== 'undefined') {\n      this._io = new IntersectionObserver((entries) => {\n        for (const e of entries) {\n          const wasIn = e.target.dataset.inView === '1';\n          e.target.dataset.inView = e.isIntersecting ? '1' : '0';\n          const v = e.target.querySelector('video');\n          if (!v) continue;\n          if (e.isIntersecting) {\n            if (wasIn) continue;              // already running — don't restart mid-section\n            v.muted = true; v.playsInline = true;\n            try { v.currentTime = 0; } catch (err) {}   // every visit opens on frame one\n            const go = () => { const q = v.play(); if (q && q.catch) q.catch(() => {}); };\n            if (v.readyState >= 2) go(); else v.addEventListener('canplay', go, { once: true });\n          } else if (!v.paused) {\n            v.pause();\n          }\n        }\n      }, { threshold: 0.5 });\n      document.querySelectorAll('[data-play-in-view]').forEach((el) => this._io.observe(el));\n    }\n\n    const reveal = document.querySelectorAll('[data-reveal]');\n    if (typeof IntersectionObserver !== 'undefined') {\n      this._reveal = new IntersectionObserver((entries) => {\n        for (const e of entries) {\n          if (!e.isIntersecting) continue;\n          e.target.dataset.in = '1';        // entrance plays once, then stop watching\n          this._reveal.unobserve(e.target);\n        }\n      }, { threshold: 0.15 });\n      reveal.forEach((el) => this._reveal.observe(el));\n    } else {\n      reveal.forEach((el) => { el.dataset.in = '1'; });\n    }\n\n    const burger = document.querySelector('.kb-burger');\n    if (burger && this._header) {\n      const header = this._header;\n      const setMenu = (open) => {\n        header.dataset.menu = open ? '1' : '0';\n        burger.setAttribute('aria-expanded', open ? 'true' : 'false');\n      };\n      this._burger = burger;\n      this._onBurger = () => setMenu(header.dataset.menu !== '1');\n      this._onMenuPick = (ev) => { if (ev.target.closest && ev.target.closest('.kb-menu a')) setMenu(false); };\n      this._onKey = (ev) => { if (ev.key === 'Escape') setMenu(false); };\n      this._onResize = () => { if (window.innerWidth > 960) setMenu(false); };\n      burger.addEventListener('click', this._onBurger);\n      document.addEventListener('click', this._onMenuPick);\n      document.addEventListener('keydown', this._onKey);\n      window.addEventListener('resize', this._onResize);\n      setMenu(false);\n    }\n\n    const contact = document.getElementById('contact');\n    if (contact) {\n      const root = document.documentElement;\n      this._contact = contact;\n      this._onMove = (ev) => {\n        const r = contact.getBoundingClientRect();\n        root.style.setProperty('--kb-x', (ev.clientX - r.left) + 'px');\n        root.style.setProperty('--kb-y', (ev.clientY - r.top) + 'px');\n      };\n      this._onEnter = () => { contact.dataset.hover = '1'; };\n      this._onLeave = () => { contact.dataset.hover = '0'; };\n      contact.addEventListener('pointermove', this._onMove, { passive: true });\n      contact.addEventListener('pointerenter', this._onEnter);\n      contact.addEventListener('pointerleave', this._onLeave);\n    }\n  }\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._onScroll);\n    if (this._io) { this._io.disconnect(); this._io = null; }\n    if (this._reveal) { this._reveal.disconnect(); this._reveal = null; }\n    if (this._burger) {\n      this._burger.removeEventListener('click', this._onBurger);\n      document.removeEventListener('click', this._onMenuPick);\n      document.removeEventListener('keydown', this._onKey);\n      window.removeEventListener('resize', this._onResize);\n      this._burger = null;\n    }\n    if (this._contact) {\n      this._contact.removeEventListener('pointermove', this._onMove);\n      this._contact.removeEventListener('pointerenter', this._onEnter);\n      this._contact.removeEventListener('pointerleave', this._onLeave);\n      this._contact = null;\n    }\n  }\n\n  renderVals() {\n    const s = this.state;\n    const bundled = (typeof window !== 'undefined' && window.__resources) ? window.__resources.heroVideo : null;\n    const src = bundled || (this.props.heroVideoSrc ?? '').trim();\n    return {\n      ctaLabel: this.props.ctaLabel ?? 'Contact us',\n      hasVideo: !!src,\n      showVideoHint: !src || s.videoFailed || !s.videoOk,\n      videoRef: (el) => {\n        if (!el) { this._video = null; return; }\n        if (this._video === el && el.dataset.src === src) return;\n        this._video = el;\n        el.dataset.src = src;\n        el.addEventListener('canplay', () => {\n          const host = el.closest('[data-play-in-view]');\n          if (!host || host.dataset.inView !== '0') { const q = el.play(); if (q && q.catch) q.catch(() => {}); }\n          if (!this.state.videoOk) this.setState({ videoOk: true, videoFailed: false });\n        });\n        el.addEventListener('error', (e) => { e.stopPropagation(); if (!this.state.videoFailed) this.setState({ videoFailed: true, videoOk: false }); }, true);\n        el.muted = true; el.loop = true; el.playsInline = true;\n        if (src) { el.src = src; el.load(); }\n      },\n      sent: s.sent,\n      notSent: !s.sent,\n      submit: () => this.setState({ sent: true })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
