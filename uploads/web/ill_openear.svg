<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 64">
<style>
.s{fill:none;stroke:#0B0B0C;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.d{fill:#0B0B0C}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-out infinite}
.pulse2{animation-delay:.5s}
@keyframes pulse{0%{opacity:0;transform:scale(.6)}30%{opacity:.9}100%{opacity:0;transform:scale(1.3)}}
.trav{animation:trav 4.5s ease-in-out infinite}
@keyframes trav{0%{transform:translateX(0)}100%{transform:translateX(64px)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.5}.trav{animation:none;transform:translateX(32px)}}
</style>
<path class="s" d="M14 24C13 13 19 5 29 5c10 0 15 8 15 16 0 7-7 9-9 14-3 8-4 14-10 14-6 0-11-4-11-10"/>
<path class="s" d="M21 17c3-5 7-7 11-5 4 2 6 5 5 9-1 6-7 10-10 14"/>
<path class="s" d="M21 20c4 2 5 5 4 7-1 3-3 3-3 5"/>
<circle class="d" cx="50" cy="16" r="3"/>
<path class="s pulse" d="M55 24a10 10 0 0 1 0 16"/>
<path class="s pulse pulse2" d="M60 20a16 16 0 0 1 0 24"/>
<path class="s" d="M18 56h96" stroke-dasharray="2 4" opacity=".35"/>
<circle class="d trav" cx="18" cy="56" r="3"/>
</svg>
