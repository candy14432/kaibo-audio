<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 64">
<style>
.s{fill:none;stroke:#0B0B0C;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.d{fill:#0B0B0C}
.faint{stroke-opacity:.35}
.pick{transform-box:view-box;transform-origin:16px 32px;animation:pick 3.2s ease-out infinite}
.p2{animation-delay:.28s}
@keyframes pick{0%{opacity:0;transform:scale(.55)}25%{opacity:.9}60%{opacity:.25}100%{opacity:0;transform:scale(1.15)}}
.send{transform-box:view-box;transform-origin:78px 32px;animation:send 3.2s ease-out infinite;animation-delay:1.1s}
.s2{animation-delay:1.38s}
@keyframes send{0%{opacity:0;transform:scale(.55)}25%{opacity:.9}60%{opacity:.25}100%{opacity:0;transform:scale(1.15)}}
/* the trace stays a waveform at every frame; only its weight breathes */
.wave{animation:live 3.2s ease-in-out infinite}
@keyframes live{0%,100%{stroke-opacity:.45}40%,60%{stroke-opacity:1}}
.lit{animation:lit 3.2s ease-out infinite;animation-delay:1.9s}
@keyframes lit{0%,55%{opacity:.22}70%{opacity:1}100%{opacity:.22}}
@media (prefers-reduced-motion:reduce){.pick,.send,.lit,.wave{animation:none}.pick,.send{opacity:.5}.lit{opacity:.9}}
</style>
<!-- a voice reaching the case, and the case passing it on to the aid -->
<path class="s pick"    d="M11 26a10 10 0 0 0 0 12"/>
<path class="s pick p2" d="M5 20a19 19 0 0 0 0 24"/>
<rect class="s" x="20" y="17" width="46" height="30" rx="6"/>
<path class="s faint" d="M26 23h34"/>
<rect class="s faint" x="26" y="27" width="34" height="15" rx="2"/>
<path class="s wave" d="M30 34.5h2.5l2-5.5 2.5 11 2.5-8 2 5 2.5-3.5 2 2h6"/>
<path class="s" d="M68 29v6"/>
<path class="s send"    d="M73 26a10 10 0 0 1 0 12"/>
<path class="s send s2" d="M80 21a18 18 0 0 1 0 22"/>
<rect class="s" x="-6" y="-13" width="12" height="26" rx="6" transform="translate(114 32) rotate(10)"/>
<circle class="d lit" cx="112" cy="24" r="1.9"/>
</svg>
