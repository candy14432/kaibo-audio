<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 64">
<style>
.s{fill:none;stroke:#0B0B0C;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.d{fill:#0B0B0C}
.pick{transform-box:view-box;transform-origin:14px 32px;animation:pick 3.2s ease-out infinite}
.p2{animation-delay:.3s}
@keyframes pick{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}60%{opacity:.25}100%{opacity:0;transform:scale(1.15)}}
.send{transform-box:view-box;transform-origin:86px 32px;animation:send 3.2s ease-out infinite;animation-delay:1.1s}
.s2{animation-delay:1.4s}
@keyframes send{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}60%{opacity:.25}100%{opacity:0;transform:scale(1.15)}}
.lit{animation:lit 3.2s ease-out infinite;animation-delay:1.9s}
@keyframes lit{0%,55%{opacity:.22}70%{opacity:1}100%{opacity:.22}}
@media (prefers-reduced-motion:reduce){.pick,.send,.lit{animation:none}.pick,.send{opacity:.5}.lit{opacity:.9}}
</style>
<!-- a voice reaches the case, the case passes it to the aid -->
<path class="s pick"    d="M8 26a11 11 0 0 0 0 12"/>
<path class="s pick p2" d="M3 21a19 19 0 0 0 0 22"/>
<rect class="s" x="22" y="23" width="34" height="19" rx="8"/>
<path class="s" d="M30 23v19" opacity=".35"/>
<circle class="d" cx="49" cy="28" r="1.6"/>
<path class="s send"    d="M66 26a11 11 0 0 1 0 12"/>
<path class="s send s2" d="M73 21a19 19 0 0 1 0 22"/>
<rect class="s" x="-6" y="-13" width="12" height="26" rx="6" transform="translate(112 32) rotate(10)"/>
<circle class="d lit" cx="110" cy="24" r="1.9"/>
</svg>
