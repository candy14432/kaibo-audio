<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 64">
<style>
.s{fill:none;stroke:#0B0B0C;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.d{fill:#0B0B0C}
.part{transform-box:fill-box;transform-origin:center;animation:fade 3.6s ease-in-out infinite}
.p2{animation-delay:.15s}
.p3{animation-delay:.3s}
@keyframes fade{0%,38%{opacity:1;transform:translateX(0)}58%,100%{opacity:0;transform:translateX(8px)}}
.merge{transform-box:fill-box;transform-origin:center;animation:pop 3.6s ease-in-out infinite}
.merge2{animation-delay:.15s}
@keyframes pop{0%,46%{opacity:0;transform:scale(.7)}66%,100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.part,.merge{animation:none}.part{opacity:.5}.merge{opacity:1;transform:none}}
</style>
<circle class="s part" cx="15" cy="15" r="5"/>
<rect class="s part p2" x="9" y="26" width="14" height="10" rx="2"/>
<rect class="s part p3" x="10" y="42" width="12" height="15" rx="2"/>
<path class="s" d="M28 32h22" stroke-dasharray="3 3" opacity=".5"/>
<rect class="d merge" x="60" y="17" width="17" height="30" rx="8.5"/>
<circle class="d merge merge2" cx="68.5" cy="13" r="3"/>
</svg>
