<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 64">
<style>
.s{fill:none;stroke:#0B0B0C;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.d{fill:#0B0B0C}
.tap{transform-box:fill-box;transform-origin:center;animation:tap 3.4s ease-out infinite}
@keyframes tap{0%,60%{opacity:0;transform:scale(.4)}12%{opacity:.85;transform:scale(1)}40%{opacity:0;transform:scale(1.9)}}
.dot1{animation:sel 3.4s steps(1) infinite}
.dot2{animation:sel 3.4s steps(1) infinite;animation-delay:1.13s}
.dot3{animation:sel 3.4s steps(1) infinite;animation-delay:2.26s}
@keyframes sel{0%,33%{opacity:1}34%,100%{opacity:.22}}
.send{transform-box:view-box;transform-origin:86px 32px;animation:send 3.4s ease-out infinite;animation-delay:.5s}
.s2{animation-delay:.8s}
@keyframes send{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}60%{opacity:.25}100%{opacity:0;transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){.tap,.dot1,.dot2,.dot3,.send{animation:none}.tap{opacity:0}.send{opacity:.5}}
</style>
<!-- the case is the control: three touch points, one lit at a time -->
<rect class="s" x="14" y="22" width="42" height="21" rx="9"/>
<circle class="d dot1" cx="26" cy="32.5" r="2.4"/>
<circle class="d dot2" cx="35" cy="32.5" r="2.4"/>
<circle class="d dot3" cx="44" cy="32.5" r="2.4"/>
<circle class="s tap" cx="26" cy="32.5" r="6"/>
<path class="s send"    d="M66 26a11 11 0 0 1 0 12"/>
<path class="s send s2" d="M73 21a19 19 0 0 1 0 22"/>
<rect class="s" x="-6" y="-13" width="12" height="26" rx="6" transform="translate(112 32) rotate(10)"/>
</svg>
